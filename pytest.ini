[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --alluredir=allure-results
markers =
    smoke: fast, critical-path checks suitable for every PR
    regression: broader coverage for nightly or release validation
    crash: deliberately crashes the app (the "Crash test item")
